<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>실시간 번개멍 메타버스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* Chat box styling */
        .chat-box { pointer-events: auto; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        
        /* Start Overlay */
        #start-overlay { pointer-events: auto; backdrop-filter: blur(10px); }
        
        .fade-out { animation: fadeOut 1s forwards; pointer-events: none; }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        .flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 5;
            transition: opacity 0.1s ease-out;
        }
    </style>
</head>
<body class="text-white">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- White Flash for Lightning -->
    <div id="flash" class="flash-overlay"></div>

    <!-- UI Layer -->
    <div id="ui-layer" class="flex flex-col justify-between p-4 md:p-6">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start w-full gap-4">
            <div>
                <h1 class="text-2xl md:text-4xl font-bold tracking-tight text-blue-100" style="text-shadow: 0 2px 10px rgba(0,255,255,0.5);">⚡ 번개멍 메타버스</h1>
                <p class="text-sm md:text-base text-gray-300 mt-1 opacity-80">바다를 클릭하여 번개를 내리쳐보세요.</p>
            </div>
            
            <!-- 날씨 연동 HUD -->
            <div id="weather-hud" class="bg-black/60 backdrop-blur-md px-5 py-2 rounded-full border border-blue-400/30 flex items-center gap-3 shadow-[0_0_15px_rgba(0,150,255,0.2)]">
                <span class="animate-pulse text-blue-400">📡</span>
                <span id="weather-text" class="text-sm font-medium text-blue-100">지역 동기화 대기 중...</span>
            </div>

            <div class="bg-black/50 px-3 py-1 rounded-full text-xs text-blue-200 border border-blue-500/30">
                접속자: <span id="user-count">12</span>명
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-box w-64 md:w-80 h-64 md:h-80 rounded-2xl flex flex-col self-end mt-auto shadow-2xl shadow-blue-900/20">
            <div class="px-4 py-2 border-b border-white/10 font-semibold text-sm text-blue-200">
                실시간 채팅
            </div>
            <div id="chat-messages" class="chat-messages flex-1 overflow-y-auto p-4 space-y-3 text-sm flex flex-col">
                <!-- Messages will be generated here -->
            </div>
        </div>
    </div>

    <!-- Start Overlay (To initialize AudioContext) -->
    <div id="start-overlay" class="absolute inset-0 z-50 bg-gray-900/90 flex flex-col items-center justify-center">
        <h2 class="text-3xl md:text-5xl font-bold mb-4 text-center">밤바다에 오신 것을 환영합니다</h2>
        <p class="text-gray-400 mb-8 text-center max-w-md px-4">소리를 켜고 감상하세요. 마우스로 바다를 클릭하면 번개가 칩니다. 아바타들이 돌아다니고 있어요!</p>
        <button id="start-btn" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-bold text-lg shadow-[0_0_20px_rgba(37,99,235,0.5)] transition-all transform hover:scale-105 active:scale-95">
            입장하기
        </button>
    </div>

<script>
    /**
     * ==========================================
     * 1. 텍스처 생성기 (Canvas API 활용)
     * 외부 이미지 없이 픽셀 아트를 생성합니다.
     * ==========================================
     */
    function createPixelTexture(art, colorStr) {
        const canvas = document.createElement('canvas');
        const size = 64; // Texture size
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        const rows = art.length;
        const cols = art[0].length;
        const pixelW = size / cols;
        const pixelH = size / rows;

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                if (art[y][x] === '#') {
                    ctx.fillStyle = colorStr;
                    ctx.fillRect(x * pixelW, y * pixelH, pixelW, pixelH);
                } else if (art[y][x] === '@') { // Eyes
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(x * pixelW, y * pixelH, pixelW, pixelH);
                }
            }
        }
        
        const texture = new THREE.CanvasTexture(canvas);
        texture.magFilter = THREE.NearestFilter; // Pixelated look
        return texture;
    }

    // 귀여운 슬라임/유령 모양 아바타 픽셀 아트
    const avatarArt = [
        "  ####  ",
        " ###### ",
        "##@@##@@",
        "########",
        "########",
        " ###### ",
        " # ## # ",
        "#      #"
    ];

    // 해골 모양 (번개 맞았을 때)
    const skeletonArt = [
        "  ####  ",
        " ###### ",
        "##@@##@@",
        "########",
        "  #  #  ",
        " ###### ",
        "  #  #  ",
        "        "
    ];

    const colors = ['#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA'];
    let avatarTextures = [];
    let skeletonTexture;

    /**
     * ==========================================
     * 2. Three.js 씬(Scene) 설정 (밤바다 구현)
     * ==========================================
     */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // 날씨 연동용 목표 배경색 변수 추가
    let targetBgColor = new THREE.Color(0x050510);
    
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, 20, 50);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 조명 (Lightning Flash용)
    const ambientLight = new THREE.AmbientLight(0x222244);
    scene.add(ambientLight);
    const flashLight = new THREE.PointLight(0xffffff, 0, 500);
    flashLight.position.set(0, 50, 0);
    scene.add(flashLight);

    // 바다 (파도 치는 평면)
    const seaGeometry = new THREE.PlaneGeometry(200, 200, 50, 50);
    seaGeometry.rotateX(-Math.PI / 2);
    
    // 바다 메테리얼 (와이어프레임 또는 진한 파란색)
    const seaMaterial = new THREE.MeshBasicMaterial({ 
        color: 0x0a1a3a, 
        wireframe: true,
        transparent: true,
        opacity: 0.3
    });
    const sea = new THREE.Mesh(seaGeometry, seaMaterial);
    scene.add(sea);

    const baseSeaGeometry = new THREE.PlaneGeometry(200, 200, 1, 1);
    baseSeaGeometry.rotateX(-Math.PI / 2);
    const baseSeaMaterial = new THREE.MeshBasicMaterial({ color: 0x020510 });
    const baseSea = new THREE.Mesh(baseSeaGeometry, baseSeaMaterial);
    baseSea.position.y = -1;
    scene.add(baseSea);


    /**
     * ==========================================
     * 3. 아바타 시스템 (유저들)
     * ==========================================
     */
    const avatars = [];
    const AVATAR_COUNT = 15;
    
    // Initialize textures
    colors.forEach(color => {
        avatarTextures.push(createPixelTexture(avatarArt, color));
    });
    skeletonTexture = createPixelTexture(skeletonArt, '#FFFFFF');

    function createAvatar() {
        const texture = avatarTextures[Math.floor(Math.random() * avatarTextures.length)];
        const material = new THREE.SpriteMaterial({ map: texture, color: 0xffffff });
        const sprite = new THREE.Sprite(material);
        
        sprite.scale.set(4, 4, 1);
        sprite.position.x = (Math.random() - 0.5) * 80;
        sprite.position.z = (Math.random() - 0.5) * 80;
        sprite.position.y = 2; // Above water

        scene.add(sprite);

        return {
            mesh: sprite,
            originalTexture: texture,
            speedX: (Math.random() - 0.5) * 0.05,
            speedZ: (Math.random() - 0.5) * 0.05,
            isFlashing: false,
            flashTimer: 0,
            isSkeleton: false,
            skeletonTimer: 0,
            targetY: 2,
            name: `유저${Math.floor(Math.random()*9000)+1000}`
        };
    }

    for (let i = 0; i < AVATAR_COUNT; i++) {
        avatars.push(createAvatar());
    }


    /**
     * ==========================================
     * 4. 번개 및 천둥 사운드 (Tone.js)
     * ==========================================
     */
    let isAudioReady = false;

    // 천둥소리 합성기 생성
    const noiseSynth = new Tone.NoiseSynth({
        noise: { type: 'pink' },
        envelope: { attack: 0.1, decay: 0.2, sustain: 0.8, release: 3.5 }
    });
    
    const filter = new Tone.Filter(300, "lowpass");
    const dist = new Tone.Distortion(0.8);
    const vol = new Tone.Volume(-5); // 볼륨 조절

    // 웅장한 울림(Rumble)을 위한 FM Synth
    const rumbleSynth = new Tone.FMSynth({
        harmonicity: 0.5, modulationIndex: 5,
        oscillator: { type: "triangle" },
        envelope: { attack: 0.2, decay: 1, sustain: 0.8, release: 4 }
    });

    noiseSynth.chain(filter, dist, vol, Tone.Destination);
    rumbleSynth.chain(new Tone.Filter(200, "lowpass"), vol, Tone.Destination);

    function playThunderSound() {
        if (!isAudioReady) return;
        
        // 거리에 따른 딜레이 시뮬레이션은 생략하고 즉시 타격감 부여
        noiseSynth.triggerAttackRelease("2n", Tone.now());
        rumbleSynth.triggerAttackRelease("C1", "1m", Tone.now() + 0.1);
        
        // 파열음 한 번 더
        setTimeout(() => {
            if(Math.random() > 0.5) noiseSynth.triggerAttackRelease("8n");
        }, 150 + Math.random() * 200);
    }

    /**
     * 번개 시각 효과 생성기 (번쩍임 + 가지형태 라인)
     */
    const bolts = [];
    const flashDiv = document.getElementById('flash');

    function createLightningBolt(targetX, targetZ) {
        // 화면 플래시
        flashDiv.style.opacity = 0.8;
        setTimeout(() => flashDiv.style.opacity = 0, 50);

        // 조명 플래시
        flashLight.position.set(targetX, 50, targetZ);
        flashLight.intensity = 15;
        ambientLight.color.setHex(0xaaaaee);

        // 번개 가지 기하학
        const material = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const points = [];
        let currentY = 100;
        let currentX = targetX + (Math.random() - 0.5) * 40;
        let currentZ = targetZ + (Math.random() - 0.5) * 40;

        points.push(new THREE.Vector3(currentX, currentY, currentZ));

        while (currentY > 0) {
            currentY -= (Math.random() * 10 + 5);
            currentX += (Math.random() - 0.5) * 15;
            currentZ += (Math.random() - 0.5) * 15;
            
            // 마지막 점은 타겟으로
            if (currentY <= 0) {
                currentY = 0;
                currentX = targetX;
                currentZ = targetZ;
            }
            points.push(new THREE.Vector3(currentX, currentY, currentZ));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        scene.add(line);
        
        bolts.push({ mesh: line, life: 1.0 });

        // 사운드 재생
        playThunderSound();

        // 아바타 피격 판정
        checkAvatarStrike(targetX, targetZ);
    }

    /**
     * ==========================================
     * 5. 상호작용 및 게임 로직
     * ==========================================
     */
    
    // 채팅 메시지 추가
    const chatContainer = document.getElementById('chat-messages');
    
    function addChatMessage(name, msg, isSystem = false) {
        const div = document.createElement('div');
        div.className = "flex flex-col animate-fade-in";
        if (isSystem) {
            div.innerHTML = `<span class="text-yellow-300 font-bold text-xs">[시스템] ${msg}</span>`;
        } else {
            const nameColor = "text-blue-300";
            div.innerHTML = `<span class="${nameColor} font-bold text-xs mb-0.5">${name}</span>
                             <span class="bg-white/10 px-3 py-1.5 rounded-lg rounded-tl-none break-words">${msg}</span>`;
        }
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // 채팅 개수 제한
        if (chatContainer.children.length > 30) {
            chatContainer.removeChild(chatContainer.firstChild);
        }
    }

    // 무작위 일상 채팅
    const randomChats = [
        "여기 분위기 너무 좋네요~",
        "비 오는 소리 들으니까 잠와요 ㅎㅎ",
        "번개 언제 치려나?",
        "불멍 말고 번개멍!",
        "오늘 하루도 수고하셨습니다 ㅠㅠ",
        "다들 어디서 접속하셨어요?",
        "물결 치는거 신기해요",
        "멍때리기 최고..."
    ];

    setInterval(() => {
        if(Math.random() > 0.6 && isAudioReady) { // 입장 후에만 채팅 생성
            const randomUser = avatars[Math.floor(Math.random() * avatars.length)];
            const msg = randomChats[Math.floor(Math.random() * randomChats.length)];
            if (!randomUser.isSkeleton) {
                addChatMessage(randomUser.name, msg);
            }
        }
    }, 4000);


    // 아바타 피격 처리
    const strikeMessages = [
        "앗, 저 번개 맞았어요ㅋㅋㅋ",
        "머리 탔다... 🔥",
        "으악 해골됨 ㅋㅋㅋㅋ",
        "찌릿찌릿하네요",
        "번개 피하기 게임인가요? ㅠㅠ"
    ];

    function checkAvatarStrike(x, z) {
        let struck = false;
        avatars.forEach(avatar => {
            if (avatar.isSkeleton || avatar.isFlashing) return; // 이미 해골이거나 번쩍이는 중이면 패스
            
            // 거리 계산
            const dx = avatar.mesh.position.x - x;
            const dz = avatar.mesh.position.z - z;
            const distance = Math.sqrt(dx*dx + dz*dz);

            // 반경 15 이내면 번개 맞음!
            if (distance < 15) {
                avatar.isFlashing = true;
                avatar.flashTimer = 40; // 번쩍이는 시간 (프레임)
                
                // 통통 튀는 효과
                avatar.targetY = 6;
                setTimeout(()=> avatar.targetY = 2, 200);

                // 채팅 남기기
                const msg = strikeMessages[Math.floor(Math.random() * strikeMessages.length)];
                addChatMessage(avatar.name, msg);
                struck = true;
            }
        });

        if (struck) {
            addChatMessage("알림", "누군가 번개에 맞았습니다! ⚡", true);
        }
    }

    // 마우스 클릭 (Raycaster)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        // UI 클릭 방지
        if(event.target.closest('#ui-layer') && !event.target.closest('#canvas-container')) return;
        if(!isAudioReady) return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        
        // 바다 평면과 교차점 찾기
        const intersects = raycaster.intersectObject(sea);
        
        if (intersects.length > 0) {
            const point = intersects[0].point;
            createLightningBolt(point.x, point.z);
        } else {
            // 허공을 클릭해도 랜덤 위치에 번개
            createLightningBolt((Math.random()-0.5)*100, (Math.random()-0.5)*100);
        }
    });

    /**
     * ==========================================
     * 6. 애니메이션 및 렌더링 루프
     * ==========================================
     */
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const time = clock.getElapsedTime();

        // 1. 바다 파도 애니메이션 (정점 조작)
        const positions = seaGeometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const y = positions[i + 1];
            // z(실제로는 y높이) 변경
            positions[i + 2] = Math.sin(time * 2 + x * 0.1) * 1.5 + Math.cos(time * 1.5 + y * 0.1) * 1.5;
        }
        seaGeometry.attributes.position.needsUpdate = true;

        // 2. 조명 페이드 아웃
        if (flashLight.intensity > 0) {
            flashLight.intensity -= 0.5;
        } else {
            ambientLight.color.setHex(0x222244); // 원래 어두운 색으로 복귀
        }

        // 3. 번개 라인 페이드 아웃 및 제거
        for (let i = bolts.length - 1; i >= 0; i--) {
            bolts[i].life -= 0.05;
            bolts[i].mesh.material.opacity = bolts[i].life;
            bolts[i].mesh.material.transparent = true;
            if (bolts[i].life <= 0) {
                scene.remove(bolts[i].mesh);
                bolts.splice(i, 1);
            }
        }

        // 4. 아바타 이동 및 상태 업데이트
        avatars.forEach(avatar => {
            // Y축 보간 (통통 튀기)
            avatar.mesh.position.y += (avatar.targetY - avatar.mesh.position.y) * 0.1;

            if (avatar.isFlashing) {
                // 번쩍이는 스트로브 효과 (몸이 하얗게/까맣게 점멸)
                avatar.flashTimer--;
                
                // 격렬하게 떨림
                avatar.mesh.position.x += (Math.random() - 0.5) * 1.5;
                avatar.mesh.position.z += (Math.random() - 0.5) * 1.5;

                if (avatar.flashTimer % 4 < 2) {
                    avatar.mesh.material.color.setHex(0xffffff); // 하얗게
                } else {
                    avatar.mesh.material.color.setHex(0x222222); // 까맣게
                }

                if (avatar.flashTimer <= 0) {
                    avatar.isFlashing = false;
                    avatar.isSkeleton = true;
                    avatar.skeletonTimer = 180; // 약 3초 유지
                    avatar.mesh.material.color.setHex(0xffffff); // 색상 복구
                    avatar.mesh.material.map = skeletonTexture;
                    avatar.mesh.scale.set(5,5,1); // 해골이 되면 살짝 커짐
                }
            } else if (avatar.isSkeleton) {
                // 해골 상태면 덜덜 떨기
                avatar.mesh.position.x += (Math.random() - 0.5) * 0.5;
                avatar.skeletonTimer--;
                if (avatar.skeletonTimer <= 0) {
                    // 원래대로 복구
                    avatar.isSkeleton = false;
                    avatar.mesh.material.map = avatar.originalTexture;
                    avatar.mesh.scale.set(4,4,1);
                }
            } else {
                // 부유하며 천천히 이동
                avatar.mesh.position.x += avatar.speedX;
                avatar.mesh.position.z += avatar.speedZ;

                // 통통 튀는 효과 (사인파)
                avatar.targetY = 2 + Math.sin(time * 5 + avatar.mesh.position.x) * 0.5;

                // 영역 벗어나면 방향 반전
                if (avatar.mesh.position.x > 80 || avatar.mesh.position.x < -80) avatar.speedX *= -1;
                if (avatar.mesh.position.z > 80 || avatar.mesh.position.z < -80) avatar.speedZ *= -1;
                
                // 가끔 방향 틀기
                if (Math.random() < 0.01) {
                    avatar.speedX = (Math.random() - 0.5) * 0.05;
                    avatar.speedZ = (Math.random() - 0.5) * 0.05;
                }
            }
        });

        // 5. 배경색 부드러운 전환 (날씨 연동 효과)
        scene.background.lerp(targetBgColor, 0.02);
        scene.fog.color.lerp(targetBgColor, 0.02);

        renderer.render(scene, camera);
    }

    // 반응형 리사이즈 처리
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 시작 버튼 (Audio Context 활성화 필수)
    document.getElementById('start-btn').addEventListener('click', async () => {
        await Tone.start();
        isAudioReady = true;
        document.getElementById('start-overlay').classList.add('fade-out');
        
        setTimeout(() => {
            document.getElementById('start-overlay').style.display = 'none';
        }, 1000);

        addChatMessage("시스템", "밤바다에 입장하셨습니다. 화면을 클릭해보세요!", true);
        
        // 날씨 데이터 연동 시작
        fetchWeatherData();
        setInterval(fetchWeatherData, 10000); // 10초마다 가짜 기상 데이터 갱신
        
        // 자동 번개 시작
        scheduleNextLightning();
    });

    // 7. 실시간 기상 데이터 연동 시뮬레이션
    const weatherStates = [
        { location: '미국 마이애미', status: '강한 뇌우 ⛈️', color: 0x1a0525, intervalMin: 1000, intervalMax: 3000, isClear: false },
        { location: '대한민국 제주도', status: '약한 천둥 🌩️', color: 0x111111, intervalMin: 4000, intervalMax: 7000, isClear: false },
        { location: '미국 하와이', status: '맑은 밤 🌌', color: 0x051530, intervalMin: 99999, intervalMax: 99999, isClear: true }
    ];
    let currentWeather = weatherStates[1];
    let lightningTimeout;

    function fetchWeatherData() {
        const randomState = weatherStates[Math.floor(Math.random() * weatherStates.length)];
        currentWeather = randomState;
        
        // 배경색 변경 예약
        targetBgColor.setHex(currentWeather.color);
        
        // UI 업데이트
        document.getElementById('weather-text').innerText = `지역 동기화: ${currentWeather.location} - ${currentWeather.status}`;
        addChatMessage("시스템", `📡 기상청 데이터 연동: [${currentWeather.location}] 반영됨`, true);
        
        // 날씨에 맞춰 번개 타이머 리셋
        scheduleNextLightning();
    }

    // 자동 번개 생성 함수 (날씨 데이터 기반 빈도 조절)
    function scheduleNextLightning() {
        clearTimeout(lightningTimeout);

        if (currentWeather.isClear || !isAudioReady) {
            // 맑은 날이거나 준비가 안 됐으면 번개 치지 않고 대기
            lightningTimeout = setTimeout(scheduleNextLightning, 2000);
            return;
        }

        const delay = currentWeather.intervalMin + Math.random() * (currentWeather.intervalMax - currentWeather.intervalMin);
        lightningTimeout = setTimeout(() => {
            if (isAudioReady && !currentWeather.isClear) {
                if (Math.random() > 0.3) {
                    // 70% 확률로 바다 무작위 위치에 번개
                    createLightningBolt((Math.random()-0.5)*150, (Math.random()-0.5)*150);
                } else {
                    // 30% 확률로 유저 머리 위로 직접 번개
                    const target = avatars[Math.floor(Math.random() * avatars.length)];
                    if (!target.isFlashing && !target.isSkeleton) {
                        createLightningBolt(target.mesh.position.x, target.mesh.position.z);
                    } else {
                        // 타겟이 이미 번개를 맞았다면 무작위 위치로
                        createLightningBolt((Math.random()-0.5)*150, (Math.random()-0.5)*150);
                    }
                }
            }
            scheduleNextLightning(); // 다음 번개 예약
        }, delay);
    }

    // 렌더링 루프 시작
    window.onload = function() {
        animate();
    };

</script>
</body>
