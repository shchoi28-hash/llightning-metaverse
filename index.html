<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>번개멍 메타버스</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #weather-status {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 16px; pointer-events: none; z-index: 10;
        }
        #flash {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: white; opacity: 0; pointer-events: none; z-index: 5;
            transition: opacity 0.1s ease-out;
        }
    </style>
    <!-- Three.js 및 Tone.js 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
    <div id="weather-status">📡 날씨 데이터 동기화 중...</div>
    <div id="flash"></div>

    <script>
        // 1. 기본 3D 장면 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 바다 만들기 (간단한 평면)
        const seaGeometry = new THREE.PlaneGeometry(200, 200, 32, 32);
        const seaMaterial = new THREE.MeshBasicMaterial({ color: 0x0a1e3f, wireframe: true });
        const sea = new THREE.Mesh(seaGeometry, seaMaterial);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -5;
        scene.add(sea);

        camera.position.z = 15;

        // 3. 아바타(유저) 만들기
        const avatarGeometry = new THREE.BoxGeometry(1, 1, 1);
        const avatarMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const avatar = new THREE.Mesh(avatarGeometry, avatarMaterial);
        scene.add(avatar);

        // 4. 사운드 설정 (천둥)
        const synth = new Tone.NoiseSynth({
            noise: { type: 'brown' },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0.05, release: 2 }
        }).toDestination();

        // 5. 날씨 및 번개 시스템
        const weatherStatus = document.getElementById('weather-status');
        const flashOverlay = document.getElementById('flash');
        let currentLightningInterval = 3000;
        let lightningTimer;

        const weathers = [
            { name: "미국 마이애미 (강한 뇌우)", color: 0x1a0a2e, interval: 2000 },
            { name: "대한민국 제주도 (약한 천둥)", color: 0x2c3e50, interval: 6000 },
            { name: "미국 하와이 (맑음)", color: 0x154360, interval: null }
        ];

        function changeWeather() {
            const w = weathers[Math.floor(Math.random() * weathers.length)];
            weatherStatus.innerText = `📡 현재 동기화된 지역: ${w.name}`;
            sea.material.color.setHex(w.color);
            
            clearInterval(lightningTimer);
            if (w.interval) {
                lightningTimer = setInterval(triggerLightning, w.interval);
            }
        }

        function triggerLightning() {
            if (Tone.context.state !== 'running') Tone.start();
            
            // 시각적 번개 효과 (배경 섬광)
            scene.background = new THREE.Color(0x555577);
            setTimeout(() => scene.background = new THREE.Color(0x000000), 100);

            // 천둥 소리
            synth.triggerAttackRelease("4n");

            // 30% 확률로 아바타가 번개에 맞음
            if (Math.random() < 0.3) {
                hitAvatar();
            }
        }

        function hitAvatar() {
            // 아바타 피격 스트로브 효과
            flashOverlay.style.opacity = 1;
            setTimeout(() => flashOverlay.style.opacity = 0, 150);
            
            // 해골(빨간색)로 변신
            avatar.material.color.setHex(0xff0000);
            setTimeout(() => avatar.material.color.setHex(0x00ff00), 2000);
        }

        // 10초마다 날씨 변경 시뮬레이션
        setInterval(changeWeather, 10000);
        changeWeather(); // 초기 실행

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            sea.rotation.z += 0.001; // 바다 물결이 움직이는 듯한 효과
            avatar.position.x = Math.sin(Date.now() * 0.002) * 5; // 아바타 이동
            renderer.render(scene, camera);
        }
        animate();

        // 화면 클릭 시 오디오 컨텍스트 활성화 (브라우저 정책 대응)
        document.body.addEventListener('click', async () => {
            await Tone.start();
            triggerLightning();
        });

        // 창 크기 변경 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
